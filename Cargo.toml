[workspace]
members = ["crates/aivory-mail-core", "crates/aivory-mail-storage", "crates/aivory-mail-api", "crates/aivory-mail-smtp"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "multipart", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
mail-parser = "0.9"
mail-send = "0.4"
lettre = { version = "0.11", features = ["tokio1", "smtp-transport", "builder", "rustls-tls", "tokio1-rustls"], default-features = false }
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart"] }
dotenvy = "0.15"
urlencoding = "2"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tower = "0.4"
hickory-resolver = "0.26"
mail-auth = "0.12"
rsa = "0.9"
rand = "0.8"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
