# Production hardening overlay. Use together with docker-compose.mail-prod.yml.
# The edge network is intentionally internal: the web process has no path to
# the shared Docker network or the Internet; browser requests reach the API
# through Traefik at https://mail.aivory.uk.
services:
  avry-mail:
    # Traefik remains the public API ingress; do not publish the API directly.
    ports: !reset []

  avry-mail-web:
    # Traefik is the sole webmail ingress; remove the direct host port.
    ports: !reset []
    networks: !override
      - avry-mail-web-edge
    labels:
      traefik.docker.network: avry-mail-web-edge
    user: "1001:1001"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=128m,uid=1001,gid=1001,mode=0755
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  avry-mail-web-edge:
    external: true
    name: avry-mail-web-edge
