version: "3.8"
services:
  avry-mail:
    build: .
    container_name: avry-mail
    ports:
      - "8095:8095"
    environment:
      - RUST_ENV=${RUST_ENV:-production}
      - PORT=8095
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_PATH=/app/data/mail-storage
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set}
      - IMAP_PASSWORD_ENCRYPTION_KEY=${IMAP_PASSWORD_ENCRYPTION_KEY:?IMAP_PASSWORD_ENCRYPTION_KEY must be set}
      - MAIL_MODE=${MAIL_MODE:-vps}
      - COGNEE_URL=${COGNEE_URL:-http://cognee-cerveau:3200}
      - COGNEE_INTERNAL_SECRET=${COGNEE_INTERNAL_SECRET:-}
      - COGNEE_AGENT_TYPE=${COGNEE_AGENT_TYPE:-mail_ops}
      - MAIL_INTELLIGENCE_MODEL=${MAIL_INTELLIGENCE_MODEL:-deepseek/deepseek-v4-flash-0731}
      - DIAGNOSTIC_MODEL=${DIAGNOSTIC_MODEL:-qwen/qwen3-235b-a22b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL:-http://avry-zeroclaw-daemon:3010}
      - WORKFLOW_URL=${WORKFLOW_URL:-http://avry-n8n-as-code:3500}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set}
      - MAIL_ADMIN_EMAIL=${MAIL_ADMIN_EMAIL:?MAIL_ADMIN_EMAIL must be set}
      - MAIL_ADMIN_PASSWORD=${MAIL_ADMIN_PASSWORD:?MAIL_ADMIN_PASSWORD must be set}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-}
      - INSPECTION_MODE=${INSPECTION_MODE:-false}
      - PUBLIC_API_URL=${PUBLIC_API_URL:?PUBLIC_API_URL must be set}
    volumes:
      - mail_storage:/app/data/mail-storage
      - mail_data:/app/data
    restart: unless-stopped
    networks:
      - aivory-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avry-mail.rule=Host(`mail.aivory.uk`)"
      - "traefik.http.routers.avry-mail.entrypoints=websecure"
      - "traefik.http.routers.avry-mail.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-mail.loadbalancer.server.port=8095"

  avry-mail-db:
    image: postgres:16-alpine
    container_name: avry-mail-db
    environment:
      - POSTGRES_DB=aivory_mail
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pg_mail_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aivory-network

  avry-mail-smtp:
    build:
      context: .
      dockerfile: Dockerfile.smtp
    container_name: avry-mail-smtp
    ports:
      - "2525:2525"
      - "2587:2587"
    environment:
      - SMTP_INGRESS_PORT=2525
      - AIVORY_MAIL_API_URL=http://avry-mail:8095
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    depends_on:
      avry-mail:
        condition: service_healthy
    networks:
      - aivory-network
    restart: unless-stopped

volumes:
  mail_storage:
  mail_data:
  pg_mail_data:

networks:
  aivory-network:
    external: true
    name: aivory-network
