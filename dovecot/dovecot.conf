dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
# Aivory Mail — minimal Dovecot IMAP + submission service.
# Postgres stays the system of record; Dovecot serves the Maildir mirror
# written by avry-mail at delivery time (/var/vmail/<domain>/<user>).
# No LMTP/postfix needed: inbound arrives via Cloudflare Worker webhook,
# outbound relays via the submission service to the Mailersend smarthost
# (port 25 stays closed).
protocols = imap submission
listen = *
# Dovecot sanitizes the environment: only listed vars are visible to %{env:...}
# (this is why DB/SMTP credentials below would otherwise expand to empty).
import_environment {
  DB_PASS=%{env:DB_PASS}
  SMTP_USER=%{env:SMTP_USER}
  SMTP_PASSWORD=%{env:SMTP_PASSWORD}
}

# Maildir tree written by avry-mail (uid/gid 1000).
mail_driver = maildir
mail_path = ~/

namespace inbox {
  inbox = yes
  subscriptions = yes
}

auth_allow_cleartext = no
auth_mechanisms = plain login
auth_verbose = yes
log_path = /dev/stderr

ssl = yes
ssl_server_cert_file = /etc/dovecot/ssl/cert.pem
ssl_server_key_file = /etc/dovecot/ssl/key.pem

# Postgres auth uses direct SQL because hashes are Dovecot-native {SHA512}
# values stored in password_hash_dovecot.
sql_driver = pgsql

pgsql avry-postgres {
  parameters {
    user = aivory
    password = $ENV:DB_PASS
    dbname = aivory_mail
  }
}

passdb sql {
  query = SELECT address AS user, password_hash_dovecot AS password FROM mailboxes WHERE lower(address) = lower('%{user}') AND password_hash_dovecot IS NOT NULL
}

userdb sql {
  query = SELECT '/var/vmail/' || lower(split_part(address, '@', 2)) || '/' || lower(split_part(address, '@', 1)) AS home, 1000 AS uid, 1000 AS gid FROM mailboxes WHERE lower(address) = lower('%{user}') AND password_hash_dovecot IS NOT NULL
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service submission-login {
  inet_listener submission {
    port = 587
  }
}

# Outbound: authenticated clients relay through the Mailersend smarthost
# (same account avry-mail itself uses). Credentials come from the container
# environment so no secret is baked into this file.
protocol submission {
  submission_relay_host = smtp.mailersend.net
  submission_relay_port = 587
  submission_relay_ssl = starttls
  submission_relay_user = $ENV:SMTP_USER
  submission_relay_password = $ENV:SMTP_PASSWORD
  submission_max_mail_size = 25M
}
