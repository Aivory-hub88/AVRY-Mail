[package]
name = "aivory-mail-api"
version = "0.1.0"
edition = "2021"
description = "Aivory Mail API — Axum HTTP server"

[dependencies]
aivory-mail-core = { path = "../aivory-mail-core" }
aivory-mail-storage = { path = "../aivory-mail-storage" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
lettre = { workspace = true }
mail-parser = { workspace = true }
mail-send = { workspace = true }
rustls = { workspace = true }
mail-builder = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
dotenvy = { workspace = true }
urlencoding = { workspace = true }
hickory-resolver = { workspace = true }
mail-auth = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[features]
s3 = ["aivory-mail-storage/s3"]
